name: meshdrive
base: core22
version: "2.1.0"
summary: MeshDrive 2.0 local-first storage with optional paid remote tier
description: |
  MeshDrive 2.0 is a local-first JuiceFS + Filebrowser agent with Textual TUI.
  Free tier: SQLite metadata and local file storage.
  Paid tier (license token): WireGuard hub-spoke, VIX gateway/FUSE, SSSD/LDAP, remote cluster.

grade: devel
confinement: classic

architectures:
  - build-on: amd64

apps:
  meshdrive:
    command: bin/meshdrive-wrapper
  doctor:
    command: bin/meshdrive-wrapper doctor
  tui:
    command: bin/meshdrive-tui-wrapper
  agent:
    command: bin/meshdrive-agent-wrapper
    daemon: simple
    restart-delay: 5s

parts:
  meshdrive:
    plugin: nil
    source: ..
    source-type: local
    override-build: |
      set -eux
      ROOT="${SNAPCRAFT_PART_INSTALL}/opt/meshdrive"
      DEST="${SNAPCRAFT_PART_INSTALL}/bin"
      mkdir -p "${ROOT}/etc" "${ROOT}/systemd" "${ROOT}/share/wireguard" "${ROOT}/packaging" "${DEST}"
      cp -a overlay/opt/meshdrive/etc/. "${ROOT}/etc/"
      cp -a overlay/opt/meshdrive/systemd/. "${ROOT}/systemd/"
      if [ -d overlay/opt/meshdrive/share/wireguard ]; then
        cp -a overlay/opt/meshdrive/share/wireguard/. "${ROOT}/share/wireguard/" || true
      fi
      if [ -d ../infra/wireguard-hub-spoke ]; then
        cp ../infra/wireguard-hub-spoke/clients/node.template/wg0.conf.template "${ROOT}/share/wireguard/" || true
        cp ../infra/wireguard-hub-spoke/scripts/nft-client.nft "${ROOT}/share/wireguard/" || true
      fi
      mkdir -p "${ROOT}/pkg"
      cp -a src "${ROOT}/pkg/src"
      cp pyproject.toml README.md "${ROOT}/pkg/"
      cp packaging/fetch-binaries.sh packaging/setup-runtime.sh packaging/build-vix.sh packaging/stage-wireguard.sh "${ROOT}/packaging/"
      chmod +x "${ROOT}/packaging/"*.sh
      python3 -m venv "${ROOT}/venv"
      "${ROOT}/venv/bin/pip" install --upgrade pip wheel
      "${ROOT}/venv/bin/pip" install "${ROOT}/pkg"
      bash "${ROOT}/packaging/fetch-binaries.sh" "${ROOT}" || true

      # Pip console scripts embed absolute shebangs from the build host
      # (/home/.../parts/meshdrive/install/...). Rewrite so they are relocatable.
      find "${ROOT}/venv/bin" -type f -print0 2>/dev/null | while IFS= read -r -d '' f; do
        if head -n1 "$f" | grep -q '^#!'; then
          sed -i '1s|^#!.*|#!/usr/bin/env python3|' "$f"
        fi
      done

      # Runtime wrappers must expand $SNAP on the target VM — never bake in
      # SNAPCRAFT_PART_INSTALL. layout maps /opt/meshdrive -> $SNAP_COMMON
      # (writable state); the venv stays under $SNAP/opt/meshdrive/venv.
      write_wrapper() {
        _out="$1"
        _module="$2"
        {
          echo '#!/bin/sh'
          echo 'set -e'
          echo 'export MESHDRIVE_ROOT="${MESHDRIVE_ROOT:-${SNAP_COMMON}}"'
          echo 'VENV="${SNAP}/opt/meshdrive/venv"'
          echo 'PY="${VENV}/bin/python3"'
          echo 'if [ ! -x "${PY}" ]; then PY="${SNAP}/usr/bin/python3"; fi'
          echo 'PYVER="$("${PY}" -c '"'"'import sys; print("%d.%d" % sys.version_info[:2])'"'"')"'
          echo 'export PYTHONPATH="${VENV}/lib/python${PYVER}/site-packages${PYTHONPATH:+:$PYTHONPATH}"'
          echo 'export PATH="${VENV}/bin:${SNAP}/usr/bin:${PATH:-/usr/bin}"'
          echo "exec \"\${PY}\" -m ${_module} \"\$@\""
        } > "${_out}"
        chmod 755 "${_out}"
      }

      write_wrapper "${DEST}/meshdrive-wrapper" "meshdrive.cli"
      write_wrapper "${DEST}/meshdrive-tui-wrapper" "meshdrive.tui"
      write_wrapper "${DEST}/meshdrive-agent-wrapper" "meshdrive.agent"
      write_wrapper "${DEST}/meshdrive-addons-wrapper" "meshdrive.addons"
      write_wrapper "${DEST}/meshdrive-mcp-wrapper" "meshdrive.mcp"
    stage-packages:
      - python3
      - python3-venv
      - python3-pip
      - fuse3
      - curl
      - ca-certificates
      - tar

layout:
  /opt/meshdrive:
    bind: $SNAP_COMMON
